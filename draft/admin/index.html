<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Mimimi Tattoo</title>
  <style>
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background:#0f1115; color:#e7e7e7; }
    header { padding: 12px 16px; border-bottom: 1px solid #2a2f3a; display:flex; gap:12px; align-items:center; }
    header label { display:flex; align-items:center; gap:6px; }
    input, select, button { background:#1a1f29; color:#e7e7e7; border:1px solid #2a2f3a; border-radius:6px; padding:8px 10px; }
    button { cursor:pointer; }
    main { padding: 12px 16px; }
    #editor { width: 100%; height: 80vh; border: 1px solid #2a2f3a; background:#0b0e13; border-radius:8px; }
  </style>
</head>
<body>
  <header>
    <strong>Предпросмотр сайта</strong>
    <label>Файл:
      <input id="path" value="index.html" placeholder="index.html">
    </label>
    <label>Ветка:
      <select id="branch">
        <option value="draft" selected>draft</option>
        <option value="main">main</option>
      </select>
    </label>
    <button id="reload">Обновить</button>
  </header>

  <main>
    <!-- sandbox оставляем пустым: скрипты внутри просматриваемого HTML не выполняются -->
    <iframe id="editor" sandbox=""></iframe>
  </main>

  <!-- ВАЖНО: параметр ?v=8 сбрасывает кэш, чтобы загрузилась последняя версия admin.js -->
  <script src="admin.js?v=8"></script>
</body>
</html>
