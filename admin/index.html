<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MIMIMI Admin</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <!-- Login View -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <h1 class="app-title">MIMIMI Admin</h1>
      <div class="login-field">
        <label for="adminPassword">Пароль</label>
        <div class="pwd-wrap">
          <input id="adminPassword" type="password" placeholder="Введите пароль" autocomplete="current-password" />
          <button id="togglePwd" class="btn ghost" type="button">Показать</button>
        </div>
      </div>
      <div id="loginError" class="error" style="display:none"></div>
      <div class="login-actions">
        <button id="loginBtn" class="btn primary">Войти</button>
        <button id="loginReset" class="btn ghost">Сбросить</button>
      </div>
      <div class="muted small">Совет: после изменения механизма входа — перелогиниться.</div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">✦</div>
        <div class="brand-text">
          <div class="brand-title">MIMIMI Admin</div>
          <div class="brand-sub">Панель управления</div>
        </div>
      </div>
      <button id="menuBtn" class="hamburger" aria-label="Меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="header-actions">
        <button id="logoutBtn" class="btn danger">Выйти</button>
      </div>
    </header>

    <!-- Top menu panel -->
    <div id="topMenu" class="menu-panel" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="menu-inner">
        <div class="menu-grid">
          <button class="menu-btn" data-nav="files">Файлы</button>
          <button class="menu-btn" data-nav="images">Изображения</button>
          <button class="menu-btn" data-nav="translations">Тексты (RU/EN)</button>
          <button class="menu-btn" data-nav="logout">Выйти</button>
        </div>
      </div>
    </div>

    <!-- Main -->
    <main class="main">
      <!-- Tab: Files -->
      <section class="tab-panel active" id="tab-files" role="tabpanel" aria-labelledby="tab-files">
        <div class="split-3">
          <!-- Column A: Files List -->
          <aside class="panel">
            <div class="panel-header">
              <div class="panel-title">Файлы <span class="tag" id="filesCount">0</span></div>
              <div class="panel-actions">
                <button id="refreshFiles" class="btn ghost small">Обновить</button>
              </div>
            </div>
            <ul id="filesUl" class="list"></ul>
          </aside>

          <!-- Column B: Editor -->
          <section class="panel" id="editorPane">
            <div class="panel-header">
              <div class="panel-title">Редактор</div>
              <div class="panel-actions">
                <button id="btnEditorFullscreen" class="btn ghost small" title="Во весь экран">⤢</button>
              </div>
            </div>

            <div class="form-row">
              <label for="editPath">Путь к файлу</label>
              <div class="inline">
                <input id="editPath" type="text" placeholder="index.html" />
                <button id="loadFileBtn" class="btn">Открыть</button>
              </div>
            </div>

            <div class="form-row">
              <label for="commitMessage">Комментарий к коммиту</label>
              <input id="commitMessage" type="text" placeholder="Update index.html" />
            </div>

            <div class="form-row">
              <label for="fileContent">Содержимое файла</label>
              <textarea id="fileContent" class="code-area" spellcheck="false" placeholder="Здесь будет содержимое файла..."></textarea>
            </div>

            <div class="panel-footer">
              <div id="fileSha" class="muted"></div>
              <div class="spacer"></div>
              <button id="saveFileBtn" class="btn primary">Сохранить</button>
            </div>
          </section>

          <!-- Column C: Preview -->
          <section class="panel" id="previewPane">
            <div class="panel-header">
              <div class="panel-title">Предпросмотр</div>
              <div class="panel-actions">
                <button id="btnPreviewFullscreen" class="btn ghost small" title="Во весь экран">⤢</button>
              </div>
            </div>
            <iframe id="editor" class="preview-frame" title="Предпросмотр"></iframe>
          </section>
        </div>
      </section>

      <!-- Tab: Images -->
      <section class="tab-panel" id="tab-images" role="tabpanel" aria-labelledby="tab-images">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Изображения</div>
            <div class="panel-actions">
              <label class="muted small" for="imagesDir">Папка</label>
              <input id="imagesDir" type="text" value="images/portfolio" class="mono small" />
              <button id="refreshImages" class="btn ghost small">Обновить</button>
            </div>
          </div>

          <div class="panel-body">
            <div class="upload-row">
              <input id="uploadInput" type="file" accept="image/*" multiple />
              <button id="uploadBtn" class="btn">Загрузить</button>
            </div>
            <div id="imagesGrid" class="grid-images"></div>
          </div>
        </div>
      </section>

      <!-- Tab: Translations -->
      <section class="tab-panel" id="tab-translations" role="tabpanel" aria-labelledby="tab-translations">
        <div class="split-2">
          <!-- JSON editor -->
          <section class="panel" id="translationsPane">
            <div class="panel-header">
              <div class="panel-title">Файл переводов</div>
              <div class="panel-actions">
                <button id="btnTranslationsFullscreen" class="btn ghost small" title="Во весь экран">⤢</button>
              </div>
            </div>
            <div class="panel-toolbar">
              <button id="btnLoadTranslations" class="btn ghost small">Загрузить файл</button>
              <button id="btnPrettyTranslations" class="btn ghost small">Форматировать</button>
              <button id="btnValidateTranslations" class="btn ghost small">Проверить</button>
              <button id="btnSaveTranslations" class="btn primary small">Сохранить</button>
              <button id="btnResetTranslations" class="btn ghost small">Отменить изменения</button>
              <div class="spacer"></div>
              <span id="translationsStatus" class="status"></span>
            </div>
            <textarea id="translationsJson" class="code-area" spellcheck="false" placeholder='{"ru":{},"en":{}}'></textarea>
            <div id="translationsJsonError" class="error" style="display:none"></div>
          </section>

          <!-- Quick fields -->
          <aside class="panel">
            <div class="panel-header">
              <div class="panel-title">Быстрые поля</div>
              <div class="panel-actions">
                <button id="btnSyncFromJson" class="btn ghost small">Из JSON → Поля</button>
                <button id="btnSyncToJson" class="btn ghost small">Из Полей → JSON</button>
              </div>
            </div>
            <div class="panel-body">
              <div class="form-row">
                <label for="ru_main_title">Заголовок (RU)</label>
                <input id="ru_main_title" type="text" />
              </div>
              <div class="form-row">
                <label for="en_main_title">Заголовок (EN)</label>
                <input id="en_main_title" type="text" />
              </div>
              <div class="form-row">
                <label for="ru_chat_welcome_message">Приветствие в чате (RU)</label>
                <textarea id="ru_chat_welcome_message" rows="3"></textarea>
              </div>
              <div class="form-row">
                <label for="en_chat_welcome_message">Приветствие в чате (EN)</label>
                <textarea id="en_chat_welcome_message" rows="3"></textarea>
              </div>
              <div class="muted small">Подтягивайте и сохраняйте через верхнюю панель.</div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js?v=40"></script>
</body>
</html>
